# Infra Hub Center on Kubernetes -- API, console and gateway from the
# published images on docker.io/infrahubcenter:
#   infrahub-api      docker.io/infrahubcenter/infrahub-api:1.0.0
#   infrahub-ui       docker.io/infrahubcenter/infrahub-ui:1.0.0
#   infrahub-gateway  docker.io/infrahubcenter/infrahub-gateway:1.0.0
#
# Database -- choose one:
#   * Managed PostgreSQL 14+ (RDS, Cloud SQL, Azure, ...): put its URL in
#     the Secret's database-url (sslmode=require for cloud databases).
#   * Built-in: also apply postgres.yaml (StatefulSet + 10 Gi volume) and
#     use postgres://infrahub:<postgres-password>@infrahub-postgres:5432/infrahub?sslmode=disable
#
#   kubectl create namespace infrahub
#   kubectl -n infrahub create secret generic infrahub-secrets \
#     --from-literal=database-url='postgres://USER:PASSWORD@HOST:5432/infrahub?sslmode=require' \
#     --from-literal=jwt-secret="$(openssl rand -hex 48)" \
#     --from-literal=ssh-credential-encryption-key="$(openssl rand -base64 32)" \
#     --from-literal=bootstrap-admin-password='<first-admin-password>'
#   # (built-in database: add --from-literal=postgres-password=<pw> and
#   #  kubectl apply -f postgres.yaml)
#   # edit PUBLIC_URL / BOOTSTRAP_ADMIN_EMAIL in the ConfigMap below, then:
#   kubectl apply -f infrahub.yaml
#   kubectl -n infrahub get pods,svc
#
# The namespace and Secret are deliberately not defined in this file, so
# re-applying it (e.g. to upgrade image tags) never overwrites your real
# secrets.
#
# The gateway Service is type LoadBalancer (cloud load balancer, or
# localhost on Docker Desktop). For an Ingress controller instead, see
# ingress.yaml next to this file. No load balancer on the cluster (kind,
# bare metal) and EXTERNAL-IP stays <pending>? Change the Service to
# type: NodePort, or test with:
#   kubectl -n infrahub port-forward svc/infrahub-gateway 8080:80
apiVersion: v1
kind: ConfigMap
metadata:
  name: infrahub-config
  namespace: infrahub
data:
  # The address browsers and agents use to reach the gateway.
  PUBLIC_URL: "http://localhost"
  # "true" once PUBLIC_URL is https://.
  COOKIE_SECURE: "false"
  BOOTSTRAP_ADMIN_EMAIL: "admin@example.com"
  BOOTSTRAP_ADMIN_NAME: "Owner"
  # community | team | business | enterprise
  INFRAHUB_PLAN: "community"
  INFRAHUB_MARKETING_URL: ""
---
# ---------------- API ----------------
apiVersion: v1
kind: Service
metadata:
  name: infrahub-api
  namespace: infrahub
spec:
  selector:
    app: infrahub-api
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: infrahub-api
  namespace: infrahub
spec:
  # One replica: the API also runs the monitoring/alert schedulers.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: infrahub-api
  template:
    metadata:
      labels:
        app: infrahub-api
    spec:
      containers:
        - name: api
          image: docker.io/infrahubcenter/infrahub-api:1.0.0
          envFrom:
            - configMapRef:
                name: infrahub-config
          env:
            - name: APP_ENV
              value: production
            - name: INFRAHUB_CONFIG_DIR
              value: /etc/infrahub
            # Built-in (postgres.yaml) or managed PostgreSQL -- whichever
            # connection string the infrahub-secrets Secret holds.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: infrahub-secrets
                  key: database-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: infrahub-secrets
                  key: jwt-secret
            - name: SSH_CREDENTIAL_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: infrahub-secrets
                  key: ssh-credential-encryption-key
            - name: BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: infrahub-secrets
                  key: bootstrap-admin-password
            # Optional: a paid plan's license key (without it, the free
            # Community plan). Add --from-literal=license-key=IHC1... to the
            # secret above.
            - name: INFRAHUB_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: infrahub-secrets
                  key: license-key
                  optional: true
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 1Gi
---
# ---------------- Console (UI) ----------------
apiVersion: v1
kind: Service
metadata:
  name: infrahub-ui
  namespace: infrahub
spec:
  selector:
    app: infrahub-ui
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: infrahub-ui
  namespace: infrahub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: infrahub-ui
  template:
    metadata:
      labels:
        app: infrahub-ui
    spec:
      containers:
        - name: ui
          image: docker.io/infrahubcenter/infrahub-ui:1.0.0
          env:
            - name: INFRAHUB_PLAN
              valueFrom:
                configMapKeyRef:
                  name: infrahub-config
                  key: INFRAHUB_PLAN
            - name: INFRAHUB_MARKETING_URL
              valueFrom:
                configMapKeyRef:
                  name: infrahub-config
                  key: INFRAHUB_MARKETING_URL
          ports:
            - containerPort: 3000
          readinessProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
---
# ---------------- Gateway ----------------
apiVersion: v1
kind: Service
metadata:
  name: infrahub-gateway
  namespace: infrahub
spec:
  type: LoadBalancer
  selector:
    app: infrahub-gateway
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: infrahub-gateway
  namespace: infrahub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: infrahub-gateway
  template:
    metadata:
      labels:
        app: infrahub-gateway
    spec:
      containers:
        - name: gateway
          image: docker.io/infrahubcenter/infrahub-gateway:1.0.0
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
