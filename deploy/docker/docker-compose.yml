# Infra Hub Center -- full platform from the published Docker Hub images
# (docker.io/infrahubcenter/*). Nothing is built locally.
#
#   1. cp .env.example .env    and fill in the values (see its comments)
#   2. docker compose up -d
#   3. open PUBLIC_URL and sign in with BOOTSTRAP_ADMIN_EMAIL / _PASSWORD
#
# Database -- pick one in .env:
#   * Built-in PostgreSQL: COMPOSE_PROFILES=postgres (default). Runs the
#     "postgres" service below with a persistent volume.
#   * Managed PostgreSQL (AWS RDS, Cloud SQL, Azure Database, your own
#     server): remove COMPOSE_PROFILES and set DATABASE_URL. The postgres
#     service is then not started at all.
#
# On first start the API migrates and seeds the database and creates the
# first admin automatically (docker-entrypoint.sh in infrahub-api).
name: infrahub

services:
  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-infrahub}
      POSTGRES_USER: ${POSTGRES_USER:-infrahub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-infrahub} -d ${POSTGRES_DB:-infrahub}"]
      interval: 5s
      timeout: 5s
      retries: 20

  infrahub-api:
    image: docker.io/infrahubcenter/infrahub-api:${INFRAHUB_VERSION:-1.0.0}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
        # Not required: with a managed database the postgres service is
        # not part of the project and the API connects to DATABASE_URL.
        required: false
    environment:
      APP_ENV: production
      # No config file: everything comes from the variables below.
      INFRAHUB_CONFIG_DIR: /etc/infrahub
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-infrahub}:${POSTGRES_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-infrahub}?sslmode=disable}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      SSH_CREDENTIAL_ENCRYPTION_KEY: ${SSH_CREDENTIAL_ENCRYPTION_KEY:?set SSH_CREDENTIAL_ENCRYPTION_KEY in .env}
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?set BOOTSTRAP_ADMIN_EMAIL in .env}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Owner}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?set BOOTSTRAP_ADMIN_PASSWORD in .env}
      # Signed license key for a paid plan; empty = the free Community plan.
      INFRAHUB_LICENSE_KEY: ${INFRAHUB_LICENSE_KEY:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  infrahub-ui:
    image: docker.io/infrahubcenter/infrahub-ui:${INFRAHUB_VERSION:-1.0.0}
    restart: unless-stopped
    depends_on:
      - infrahub-api
    environment:
      INFRAHUB_PLAN: ${INFRAHUB_PLAN:-community}
      INFRAHUB_MARKETING_URL: ${INFRAHUB_MARKETING_URL:-}

  infrahub-gateway:
    image: docker.io/infrahubcenter/infrahub-gateway:${INFRAHUB_VERSION:-1.0.0}
    restart: unless-stopped
    depends_on:
      - infrahub-api
      - infrahub-ui
    ports:
      - "${INFRAHUB_HTTP_PORT:-80}:80"

volumes:
  postgres_data:
